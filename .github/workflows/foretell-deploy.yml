name: Foretell build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: foretell-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/gadielkalleb/postiz-app

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and publish the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_VERSION=sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Install the restricted VPS deploy key
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ vars.VPS_HOST_KEY }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/foretell-ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/foretell-ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/foretell-ssh/id_ed25519"
          printf '%s\n' "$VPS_HOST_KEY" > "$RUNNER_TEMP/foretell-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/foretell-ssh/known_hosts"

      - name: Pull and recreate only postiz
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ github.repository_owner }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          printf '%s\n%s\n' "$GHCR_USERNAME" "$GHCR_TOKEN" |
            ssh \
              -i "$RUNNER_TEMP/foretell-ssh/id_ed25519" \
              -p "$VPS_PORT" \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/foretell-ssh/known_hosts" \
              "$VPS_USER@$VPS_HOST" \
              "foretell-deploy sha-${GITHUB_SHA}"
